name: Build the reading room

on:
  schedule:
    - cron: "23 * * * *"   # hourly: picks up new Substack pieces on its own
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from the feed
        run: |
          pip install beautifulsoup4
          python build.py

      - name: Keep new pieces and images in the repo
        run: |
          git config user.name "reading-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts images
          if git diff --cached --quiet; then
            echo "No new pieces."
          else
            git commit -m "New or updated pieces from the feed"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
