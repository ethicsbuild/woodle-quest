name: Build the reading room

on:
  schedule:
    - cron: "23 * * * *"   # hourly: picks up new Substack pieces on its own
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from the feed
        id: build
        run: |
          pip install -q beautifulsoup4
          set -o pipefail
          python build.py 2>&1 | tee build-log.txt

      - name: Keep new pieces, images and the build log in the repo
        id: keep
        if: always()
        run: |
          git config user.name "reading-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posts images build-log.txt; do [ -e "$f" ] && git add -A "$f"; done; true
          changed=false
          if git diff --cached --quiet; then
            echo "No new pieces."
          else
            git commit -m "New or updated pieces from the feed"
            git pull --rebase origin main
            git push
            changed=true
          fi
          # The hourly run only republishes when something actually changed.
          if [ "$changed" = true ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.build.outcome == 'success' && steps.keep.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: steps.build.outcome == 'success' && steps.keep.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # the video makes the upload large; give Pages 30 minutes
