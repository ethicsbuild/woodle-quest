name: Transcribe videos

# Runs whenever a video lands in media/. Writes media/<id>.vtt (captions)
# and media/<id>.txt (readable transcript), then asks the site to rebuild.

on:
  push:
    branches: [main]
    paths: ["media/*.mp4"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Transcribe any video without a transcript
        id: tx
        run: |
          set -o pipefail
          { pip install -q faster-whisper imageio-ffmpeg && python transcribe.py; } 2>&1 | tee transcribe-log.txt

      - name: Save transcripts and rebuild the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reading-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media transcribe-log.txt
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Transcripts for new videos"
            git pull --rebase origin main
            git push
            if [ "${{ steps.tx.outcome }}" = "success" ]; then gh workflow run build.yml --ref main; fi
          fi
